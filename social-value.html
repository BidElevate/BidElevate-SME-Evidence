<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Social value commitments | BidElevate</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
:root{
  --bg:#f3f6f4; --surface:#ffffff; --ink:#1f2b27; --muted:#5b6964; --line:#d6dfda;
  --brand:#3e554f; --brand-ink:#ffffff; --brand-soft:#e3ebe7; --field:#ffffff; --field-line:#b7c4bf;
  --danger:#a2432f; --danger-soft:#f7e3dd;
  --ok-soft:#dcebe3; --ok-ink:#2c5a45; --todo-soft:#ece7dc; --todo-ink:#6b5a2e; --no-soft:#ebeeed;
  --display:"Lora",Georgia,serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a18; --surface:#1c2421; --ink:#e6ece9; --muted:#9caaa4; --line:#2f3b37;
  --brand:#8fb3a6; --brand-ink:#10201a; --brand-soft:#24332e; --field:#151c1a; --field-line:#3c4a45;
  --danger:#ec8f7a; --danger-soft:#3a221d; --ok-soft:#1f3a2e; --ok-ink:#a8d5bd; --todo-soft:#3a331f; --todo-ink:#e0cf9c; --no-soft:#2a302e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a18; --surface:#1c2421; --ink:#e6ece9; --muted:#9caaa4; --line:#2f3b37;
  --brand:#8fb3a6; --brand-ink:#10201a; --brand-soft:#24332e; --field:#151c1a; --field-line:#3c4a45;
  --danger:#ec8f7a; --danger-soft:#3a221d; --ok-soft:#1f3a2e; --ok-ink:#a8d5bd; --todo-soft:#3a331f; --todo-ink:#e0cf9c; --no-soft:#2a302e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1280px;margin:0 auto;padding-block:20px 48px;display:grid;gap:16px}
.brandbar{font-family:var(--display);font-weight:600;color:var(--brand);font-size:1.15rem}
h1{font-family:var(--display);font-size:1.5rem;margin:4px 0 6px;text-wrap:balance}
h2{font-family:var(--display);font-size:1.15rem;margin:0 0 10px}
p{margin:0}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.banner{border-radius:8px;padding:10px 12px;font-weight:600}
.banner.due{background:var(--danger-soft);color:var(--danger)}
.banner.error{background:var(--danger-soft);color:var(--danger);font-weight:500}
.banner.error ul{margin:4px 0 0;padding-left:18px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field:last-child{margin-bottom:0}
.lab,label.lab{font-weight:600;font-size:.95rem}
.opt{color:var(--muted);font-weight:400;font-size:.88rem}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--field-line);border-radius:8px;padding:9px 11px;min-height:44px}
textarea{resize:vertical;min-height:80px}
input.bad,textarea.bad{border-color:var(--danger);background:var(--danger-soft)}
input:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 40%,transparent);outline-offset:1px;border-color:var(--brand)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:.95rem}
.chk input{width:20px;height:20px;min-height:0;margin-top:2px;accent-color:var(--brand);flex:none}
.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);padding:10px 18px;min-height:46px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.btn[disabled]{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--brand);text-decoration:underline;cursor:pointer}
details summary{cursor:pointer;color:var(--brand);font-weight:600;font-size:.95rem}
details ol{margin:8px 0 0;padding-left:20px;font-size:.92rem}
.saved{font-size:.82rem;color:var(--muted)}

/* Commitment cards */
.cnum{font-size:.85rem;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.years{width:100%;border-collapse:collapse;font-size:.95rem;margin-top:2px}
.years th,.years td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.years th{font-size:.82rem;color:var(--muted);font-weight:600}
.years td.q{width:auto}
.years input{padding:6px 8px;text-align:right;min-height:40px;font-variant-numeric:tabular-nums}
.years tr.total td{font-weight:700;border-bottom:0}
.years tr.total td.q{text-align:right;padding-right:17px;font-variant-numeric:tabular-nums}
.part{font-size:.8rem;color:var(--muted);display:block}
.radios{display:grid;gap:8px}
.radios.bad{outline:2px solid var(--danger);outline-offset:4px;border-radius:6px}
.chk input[type=radio]{accent-color:var(--brand)}
.qw{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.qw input{width:84px;flex:none}
.qw .pre{font-weight:600}
.qw .suf{font-size:.82rem;color:var(--muted);max-width:120px;line-height:1.25}
select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--field-line);border-radius:8px;padding:9px 11px;min-height:44px}
select.bad{border-color:var(--danger);background:var(--danger-soft)}
.decision{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--brand-soft);display:grid;gap:8px}
.decision.bad{background:var(--danger-soft);color:var(--danger)}
.renote{font-size:.88rem;color:var(--danger);font-weight:600}
.guide{margin:0 0 2px}
/* Option A layout: one open card, three columns on wide screens */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}
.topmain{flex:1 1 320px;min-width:0}
.top .banner.due{flex:none}
.introrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.introrow .txt{flex:1 1 420px;min-width:0;max-width:860px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok-ink)}
.pill.todo{background:var(--todo-soft);color:var(--todo-ink)}
.pill.no{background:var(--no-soft);color:var(--muted)}
section.card{padding:0;overflow:hidden}
section.card.open{border:2px solid var(--brand)}
.chead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:14px 18px}
.card.open .chead{background:var(--brand-soft);border-bottom:1px solid var(--line)}
.chead .cnum{margin:0;flex:none}
.ctitle{font-family:var(--display);font-weight:600;font-size:1.05rem;flex:1 1 240px;min-width:0}
.ctitle.struck{text-decoration:line-through;color:var(--muted)}
.csum{color:var(--muted);font-size:.9rem}
.cols{display:grid;grid-template-columns:minmax(0,1fr)}
.col{padding:18px;min-width:0}
.col + .col{border-top:1px solid var(--line)}
.colhead{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin:0 0 12px}
.dbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 18px;border-top:1px solid var(--line);background:var(--bg)}
.dbar.bad{background:var(--danger-soft)}
.dq{font-weight:600;flex:1 1 220px}
.dbar .renote{flex-basis:100%;order:3}
.dbtns{display:flex;gap:10px;flex:1 1 260px;justify-content:flex-end}
.dbtns .btn{flex:1 1 0;max-width:180px}
.btn.decline{background:transparent;color:var(--danger);border-color:var(--danger)}
.dnote{padding:16px 18px;color:var(--muted)}
.signgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:0 16px}
#send{width:100%;margin-top:14px}
@media (min-width:960px){
  .cols{grid-template-columns:repeat(3,minmax(0,1fr))}
  .col + .col{border-top:0;border-left:1px solid var(--line)}
  .signgrid{grid-template-columns:1.4fr 1fr 1fr}
  .signgrid .field{margin-bottom:14px}
  #send{width:auto;min-width:320px;display:flex;margin-left:auto}
}
@media (max-width:560px){.dbtns .btn{max-width:none}}
.confirm{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--brand-soft)}
.confirm.bad{background:var(--danger-soft);color:var(--danger)}
footer{color:var(--muted);font-size:.8rem;text-align:center}
</style>
</head>
<body>
<main id="app"><div class="brandbar">BidElevate</div></main>
<input type="file" id="draftfile" accept=".json,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
/* Settings. Uses its own EmailJS template (Social Value Form).
   The recipient (hello@bidelevate.co.uk) is set in the EmailJS template. */
const SETTINGS = {
  EMAILJS_PUBLIC_KEY: 'ZxayBeLVQRYJoLquJ',
  EMAILJS_SERVICE_ID: 'service_yf3sg5y',
  EMAILJS_TEMPLATE_ID: 'template_fxnvy5r'
};

(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const app = $('app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const isDate = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmt = v => { if (!isDate(v)) return ''; const [y,m,d] = v.split('-'); return (+d) + ' ' + MON[+m-1] + ' ' + y; };
  const fmtStamp = iso => new Date(iso).toLocaleString('en-GB', { timeZone:'Europe/London', day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  const store = {
    get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } },
    set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e) { return false; } }
  };

  /* ---------- contract years: counted from the contract start date, last one may be a part year ---------- */
  const iso = d => d.toISOString().slice(0,10);
  const parts = v => v.split('-').map(Number);
  function addYears(v, n){ const [y,m,d] = parts(v); const last = new Date(Date.UTC(y+n, m, 0)).getUTCDate(); return iso(new Date(Date.UTC(y+n, m-1, Math.min(d, last)))); }
  function addDays(v, n){ const [y,m,d] = parts(v); return iso(new Date(Date.UTC(y, m-1, d+n))); }
  const my = v => { const [y,m] = parts(v); return MON[m-1] + ' ' + y; };
  function contractYears(s, e){
    if (!isDate(s) || !isDate(e) || e < s) return [];
    const out = [];
    for (let k = 0; k < 25; k++){
      const ys = addYears(s, k); if (ys > e) break;
      let ye = addDays(addYears(s, k+1), -1), partial = false;
      if (ye > e) { ye = e; partial = true; }
      const days = (Date.parse(ye) - Date.parse(ys)) / 864e5 + 1;
      out.push({ s: ys, e: ye, partial, months: Math.max(1, Math.round(days / 30.44)) });
    }
    return out;
  }
  const yearLabel = (y, i) => 'Year ' + (i+1) + ' (' + my(y.s) + ' – ' + my(y.e) + ')';
  const num = v => (v === '' || v == null || !isFinite(+v)) ? null : +v;
  const fmtNum = n => (Math.round(n*100)/100).toLocaleString('en-GB');


  /* ---------- units: same rules on the builder, client form and email ---------- */
  const UNITS = [
    { k:'gbp',    label:'Pounds (£)', money:true, alias:['£','pounds','pound','gbp','money'] },
    { k:'staff',  label:'Staff briefed', one:'staff member briefed', many:'staff briefed', tOne:'staff briefing completion', tMany:'staff briefing completions', alias:['staff','staff members briefed'] },
    { k:'place',  label:'Student placements', one:'placement', many:'placements', alias:['placements','placement','student placement'] },
    { k:'hours',  label:'Volunteering hours', one:'hour', many:'hours', alias:['hours','volunteer hours','volunteering hour'] },
    { k:'travel', label:'Travel plans / reviews', one:'plan', many:'plans', alias:['travel plans','travel plan','travel reviews','travel plans/reviews'] },
    { k:'events', label:'Fundraising events', one:'event', many:'events', alias:['fundraising event','events'] }
  ];
  const unitOf = u => { const t = String(u || '').trim().toLowerCase().replace(/\s+/g, ' '); return t ? (UNITS.find(x => x.label.toLowerCase() === t || x.alias.includes(t)) || null) : null; };
  const normUnit = u => { const p = unitOf(u); return p ? p.label : String(u || '').trim(); };
  const unitLabel = normUnit;
  const singular = w => /ies$/i.test(w) ? w.slice(0, -3) + 'y' : /(ss|sh|ch|x)es$/i.test(w) ? w.slice(0, -2) : /[^s]s$/i.test(w) ? w.slice(0, -1) : w;
  const nf = (n, money) => n.toLocaleString('en-GB', { minimumFractionDigits: money && n % 1 ? 2 : 0, maximumFractionDigits: 2 });
  function unitWord(u, n, isTotal){
    const p = unitOf(u), one = n === 1;
    if (p) { if (p.money) return ''; if (isTotal && p.tMany) return one ? p.tOne : p.tMany; return one ? p.one : p.many; }
    const t = String(u || '').trim();
    if (!t || !one) return t;
    // Singularise the first plural-looking word: "mentoring sessions" -> "mentoring session"
    const w = t.split(' '), j = w.findIndex(x => /(ies|[^suis]s)$/i.test(x));
    if (j >= 0) w[j] = singular(w[j]);
    return w.join(' ');
  }
  function fmtQty(n, u, isTotal){
    if (n == null) return '–';
    const p = unitOf(u);
    if (p && p.money) return '£' + nf(n, true);
    const w = unitWord(u, n, isTotal);
    return nf(n) + (w ? ' ' + w : '');
  }
  const isMoney = u => { const p = unitOf(u); return !!(p && p.money); };
  const unitSelect = (id, a) => `<select id="${id}"><option value="">Choose a unit</option>${UNITS.map(x => `<option value="${x.k}"${!a.uo && unitOf(a.u) === x ? ' selected' : ''}>${esc(x.label)}</option>`).join('')}<option value="other"${a.uo ? ' selected' : ''}>Other — specify</option></select>`;

  /* ---------- read the link ---------- */
  let C = null;
  const m = location.search.match(/[?&]d=([^&#]+)/);
  try { C = m && JSON.parse(LZString.decompressFromEncodedURIComponent(m[1])); } catch(e) {}
  const Y = C ? contractYears(C.s, C.e) : [];
  if (!C || !Array.isArray(C.a) || !C.a.length || !Y.length) {
    app.insertAdjacentHTML('beforeend', '<section><h1>This link isn\'t complete</h1><p>Please open the link from your email again, making sure you copy all of it.</p></section>');
    return;
  }

  const FIELDS = ['n','g','u','im','st','p','hw','r','rr','ev'];
  const EXOPT = { yes: 'Yes, we already do this.', more: 'Yes, but we will increase our activity for this contract.', new: 'No, this will be a new activity.' };
  const LABELS = { n:'Commitment', g:'Client guidance', u:'Unit', im:'Expected difference', q:'Yearly figures', st:'Start date', p:'Delivery period', hw:'Delivery approach', r:'Responsible person name', rr:'Responsible person role', ev:'Evidence' };
  const orig = C.a.map(a => {
    const o = {}; FIELDS.forEach(f => o[f] = a[f] || '');
    o.u = normUnit(o.u); o.uo = !!(o.u && !unitOf(o.u));
    o.rs = o.r.trim(); o.r = ''; o.rr = ''; // the client must type the responsible person themselves
    o.q = Y.map((_, k) => (a.q && a.q[k] !== '' && a.q[k] != null) ? String(a.q[k]) : '');
    return o;
  });

  // Key ties saved answers to this exact form
  const KEY = 'be_sv1_' + LZString.compressToBase64(C.c + '|' + C.t + '|' + C.s + '|' + C.e + '|' + C.a.map(a => a.n).join('|')).slice(0, 60);
  let A = orig.map(o => Object.assign({}, o, { q: o.q.slice(), d: '', ex: '', cur: '', cm: '' }));
  let F = { name:'', title:'', notes:'' };
  let sentRef = null;
  function cleanA(list){
    if (!Array.isArray(list) || list.length !== A.length) return null;
    return list.map(x => { const o = {}; FIELDS.forEach(f => o[f] = typeof x[f] === 'string' ? x[f] : ''); if (!isDate(o.st)) o.st = '';
      o.q = Y.map((_, k) => (Array.isArray(x.q) && x.q[k] != null) ? String(x.q[k]) : ''); o.d = (x.d === 'approve' || x.d === 'decline') ? x.d : '';
      o.u = normUnit(o.u); o.uo = x.uo != null ? !!x.uo : !!(o.u && !unitOf(o.u));
      o.ex = EXOPT[x.ex] ? x.ex : ''; o.cur = x.cur != null ? String(x.cur) : ''; o.cm = typeof x.cm === 'string' ? x.cm : ''; return o; });
  }
  const saved = store.get(KEY);
  if (saved) { const a = cleanA(saved.A); if (a) { A = a; F = Object.assign(F, saved.F || {}); sentRef = saved.sentRef || null; } }
  let saveTimer;
  function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(() => { if (store.set(KEY, { A, F, sentRef, at: new Date().toISOString() })) $('savedat').textContent = 'Saved on this device'; }, 300); }

  /* ---------- page ---------- */
  document.title = 'Social value commitments – ' + C.t + ' | BidElevate';
  const contractLine = 'Contract ' + fmt(C.s) + ' to ' + fmt(C.e) + (C.aw ? ' · Expected award ' + fmt(C.aw) : '');
  app.insertAdjacentHTML('beforeend', `
    <section class="top">
      <div class="topmain">
        <p class="muted small"><span aria-hidden="true">🌿</span> Social value commitments · ${esc(C.c)}</p>
        <h1>${esc(C.t)}</h1>
        <p class="muted small">${esc(contractLine)}</p>
      </div>
      ${C.d ? `<div class="banner due">Please send this back by ${esc(fmt(C.d))}</div>` : ''}
    </section>
    <div id="formview" style="display:grid;gap:16px">
      <section>
        <p>These are the extra benefits your organisation would offer the local community through this contract, such as placements, volunteering or local jobs. We have suggested some, with figures for each contract year.</p>
        <div class="introrow" style="margin-top:10px">
          <p class="txt">Work through each one: change anything that isn't realistic for you, then approve it, or decline it if you don't want to offer it. Only commit to what you are confident you can deliver and show evidence for, because these become promises in your tender.</p>
          <div class="pills" id="pills" aria-live="polite"></div>
        </div>
      </section>
      <div id="acts" style="display:grid;gap:16px"></div>
      <section id="signoff">
        <div class="signgrid">
          <div class="field"><label class="lab" for="notes">Anything we should know? <span class="opt">(optional)</span></label><textarea id="notes" placeholder="For example, another commitment you'd like to offer, or something you aren't sure about"></textarea></div>
          <div class="field"><label class="lab" for="name">Your name</label><input type="text" id="name" autocomplete="name"></div>
          <div class="field"><label class="lab" for="title">Your job title</label><input type="text" id="title" autocomplete="organization-title"></div>
        </div>
        <label class="chk" id="okl"><input type="checkbox" id="ok"> I confirm the commitments I have approved, and their yearly figures, are realistic and agreed by our organisation.</label>
        <div id="err" class="banner error" hidden style="margin-top:12px"></div>
        <button class="btn" type="button" id="send">Send commitments to BidElevate</button>
        <p class="saved" id="savedat" style="margin-top:8px"></p>
      </section>
      <section>
        <details>
          <summary>Need a colleague to finish it?</summary>
          <ol>
            <li>Tap <button class="linkbtn" type="button" id="dl">Download my answers</button>. This saves a small file.</li>
            <li>Email that file <strong>and</strong> this link to your colleague.</li>
            <li>They open the link and tap <button class="linkbtn" type="button" id="imp">Load answers from a file</button>.</li>
          </ol>
          <p class="muted small" style="margin-top:8px">Forwarding the link on its own sends a form with only our suggestions in it.</p>
        </details>
      </section>
      <footer>BidElevate Ltd · hello@bidelevate.co.uk</footer>
    </div>
    <div id="doneview" hidden></div>`);

  /* ---------- one open card at a time ---------- */
  let openIdx = -1;
  const qTotal = a => a.q.reduce((t, v) => t + (num(v) || 0), 0);
  const PILL = { approve: ['Approved', 'ok'], decline: ['Declined', 'no'], '': ['To review', 'todo'] };
  function counts(){
    const n = { approve: 0, decline: 0, '': 0 }; A.forEach(a => n[a.d]++);
    $('pills').innerHTML = `<span class="pill ok">${n.approve} approved</span><span class="pill todo">${n['']} to review</span>` + (n.decline ? `<span class="pill no">${n.decline} declined</span>` : '');
  }
  function paintHead(i){
    const a = A[i], t = $('t'+i), pl = $('pl'+i), op = $('op'+i);
    t.textContent = a.n.trim() || 'Commitment ' + (i+1);
    t.classList.toggle('struck', a.d === 'decline');
    pl.textContent = PILL[a.d][0]; pl.className = 'pill ' + PILL[a.d][1];
    const shut = i !== openIdx;
    $('sm'+i).textContent = shut && a.d !== 'decline' && a.q.some(v => num(v) != null) ? fmtQty(qTotal(a), a.u, true) + ' over the contract' : '';
    op.hidden = !shut; op.textContent = a.d === 'decline' ? 'Change' : 'Open';
  }
  function setOpen(i, scroll){

    $('send').disabled = true; $('send').textContent = 'Sending…';
    const at = new Date().toISOString();
    const ref = sentRef && sentRef.pending ? sentRef.ref : newRef();
    sentRef = sentRef && sentRef.pending ? sentRef : { ref, pending: true };
    store.set(KEY, { A, F, sentRef, at });
    const E = buildEmail(ref, at);
    // EmailJS caps each send at 50KB. A very long form goes as two emails with the same reference.
    const subj = 'Social value commitments – ' + C.c + ' – ' + C.t + ' – ' + ref;
    const parts = new TextEncoder().encode(E.both).length > 45000 ? [E.main + '<p style="font-size:12px;color:#5b6964">The structured data follows in a second email.</p>', E.json] : [E.both];
    sentRef.parts = (sentRef.parts && sentRef.parts.length === parts.length) ? sentRef.parts : parts.map(() => false);
    try {
      if (!window.emailjs) throw new Error('The email service did not load. Check your internet connection.');
      if (!/^template_[A-Za-z0-9]+$/.test(SETTINGS.EMAILJS_TEMPLATE_ID)) throw new Error('This form is not finished being set up. Please tell BidElevate.');
      emailjs.init({ publicKey: SETTINGS.EMAILJS_PUBLIC_KEY });
      for (let p = 0; p < parts.length; p++) {
        if (sentRef.parts[p]) continue;
        const res = await emailjs.send(SETTINGS.EMAILJS_SERVICE_ID, SETTINGS.EMAILJS_TEMPLATE_ID, {
          subject: subj + (parts.length > 1 ? ' (' + (p+1) + ' of ' + parts.length + ')' : ''),
          submission_ref: ref, client_name: C.c, tender_title: C.t, content_html: parts[p]
        });
        if (!res || res.status !== 200) throw new Error('The email service replied with an error.');
        sentRef.parts[p] = true; store.set(KEY, { A, F, sentRef, at });
        if (p < parts.length - 1) await new Promise(r => setTimeout(r, 1200));
      }
      sentRef = { ref, pending: false, at }; store.set(KEY, { A, F, sentRef, at });
      done(ref);
    } catch(e) {
      err.innerHTML = 'Your commitments have not been sent yet. ' + esc((e && (e.text || e.message)) || '') + '<br>Your answers are saved on this device. Please check your connection and tap Send again.';
      err.hidden = false;
      $('send').disabled = false; $('send').textContent = 'Send commitments to BidElevate';
    }
    sending = false;
  };
  function done(ref){
    $('formview').hidden = true;
    const v = $('doneview'); v.hidden = false;
    v.innerHTML = `<section style="text-align:center"><h2>Thank you. Your commitments have been sent.</h2>
      <p>BidElevate will use them in the social value part of your tender.</p>
      <p class="muted small" style="margin-top:8px">Reference ${esc(ref)}</p>
      <button class="linkbtn small" type="button" id="again" style="margin-top:10px">Need to change something? Edit and send again</button></section>`;
    $('again').onclick = () => { v.hidden = true; $('formview').hidden = false; $('ok').checked = false; A.forEach(a => a.d = ''); renderActs(); fitAll(); sentRef = null; save(); window.scrollTo({top:0}); };
    window.scrollTo({ top:0 });
  }
  if (sentRef && !sentRef.pending) done(sentRef.ref);
})();
</script>
